<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="doc-title">Loading…</title>
<meta id="meta-desc" name="description" content="">
<meta id="meta-theme" name="theme-color" content="#0a0b0d">
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d0f'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%237dd3c0' stroke-width='2.5'/%3E%3Ccircle cx='12.5' cy='12.5' r='2.6' fill='%237dd3c0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="preload" as="image" href="../assets/product/shot-1.png">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./shop.css">
</head>
<body>
<div class="page">
  <h1>
    <img class="mark" id="brand-logo" src="" alt="" width="128" height="128">
    <span id="brand-name"></span>
  </h1>
  <p class="tagline" id="brand-tagline"></p>

  <div class="card stage-card">
    <div class="compare">
      <div class="switch" role="tablist" aria-label="상세페이지 비교" data-view="before">
        <span class="switch-thumb" aria-hidden="true"></span>
        <button type="button" role="tab" id="tab-before" aria-selected="true" aria-controls="stage" data-view="before">Before</button>
        <button type="button" role="tab" id="tab-after" aria-selected="false" aria-controls="stage" data-view="after" tabindex="-1">After</button>
      </div>
    </div>
    <section id="stage" data-view="before" aria-labelledby="product-name" role="tabpanel">
      <div class="shop-body">
        <header class="shop-header">
          <span class="shop-logo" id="shop-name"></span>
          <nav class="shop-nav" aria-label="쇼핑몰 메뉴">
            <button type="button" aria-label="검색"><i class="ph ph-magnifying-glass" aria-hidden="true"></i></button>
            <button type="button" aria-label="전체 메뉴"><i class="ph ph-list" aria-hidden="true"></i></button>
            <button type="button" class="btn-header-cart" aria-label="장바구니"><i class="ph ph-shopping-bag" aria-hidden="true"></i></button>
          </nav>
        </header>
        <div class="shop-content">
        <div class="shop-grid">
          <div class="gallery" id="gallery">
            <figure class="main-shot" id="main-shot">
              <img id="main-img" src="" alt="" width="1080" height="1440" fetchpriority="high">
              <div id="viewer-layer"></div>
              <canvas id="canvas" aria-label=""></canvas>
            </figure>
          </div>

          <aside class="buybox" aria-label="구매 정보">
            <p class="crumbs" id="product-crumbs"></p>
            <h2 id="product-name"></h2>
            <p class="price"><span class="now" id="product-price"></span></p>
            <div class="options">
              <div class="opt-row">
                <span class="opt-label">색상</span>
                <span class="swatch" id="product-swatch"></span>
              </div>
              <div class="opt-row">
                <span class="opt-label" id="size-label">사이즈</span>
                <div class="sizes" role="radiogroup" aria-labelledby="size-label">
                  <label><input type="radio" name="size" value="S"><span>S</span></label>
                  <label><input type="radio" name="size" value="M" checked><span>M</span></label>
                  <label><input type="radio" name="size" value="L"><span>L</span></label>
                  <label><input type="radio" name="size" value="XL"><span>XL</span></label>
                </div>
              </div>
            </div>
            <div class="actions">
              <button type="button" class="btn-cart">장바구니</button>
              <button type="button" class="btn-buy">구매하기</button>
            </div>
          </aside>
        </div>
        </div>

        <span class="wipe-line" id="wipe-line" aria-hidden="true"></span>
      </div>
    </section>
  </div>

  <div class="feature-cards" id="feature-cards"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://teo646.github.io/snap3d-viewer/dist/viewer.js"></script>
<script src="./app.js"></script>
</body>
</html>
